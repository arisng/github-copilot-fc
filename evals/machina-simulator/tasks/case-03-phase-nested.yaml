id: case-03-phase-nested
name: Drive a parent machine with a nested phase child run and replay both
description: >-
  Agent drives a parent machine with a PHASE state, init's and drives the child
  machine (nested run) to terminal, then completes the parent with PHASE_DONE
  --child-run. Produces two run dirs in the same runs/ root. The program grader
  replays BOTH runs through the machina-simulator engine: parent run verifiable
  + hash-ok + complete at parent-done WITH a child run in its replay trace
  (nested badge), child run verifiable + complete at child-done.
tags: [positive, drive, nested, multi-skill, replay]
inputs:
  prompt: >-
    Your task is to drive a Machina state machine with a PHASE state to its
    terminal state and produce the report. The phase delegates to a child run,
    which mirrors a skill handing its governed work to a nested sub-machine.
    Everything you need is below — do NOT look for external sample files. The
    workspace contains:
      - skills/machina-driving/scripts/machine-driver.py (the driver)
      - skills/machina-authoring/scripts/machine-validator.py (its dependency)

    Use PYTHON, not python3:  python skills/machina-driving/scripts/
    machine-driver.py --help

    Write these two machines into the workspace as parent.json and child.json
    (they are not present yet — you create them):

    parent.json:
      {"id": "parent-task", "name": "Parent Task", "version": "1.0.0",
       "spec_version": "3.0.0", "initial": "starting",
       "context": {"child_result": ""},
       "scenarios": [{"id": "default", "label": "Default",
         "initial": "starting"}],
       "states": {
         "starting": {"description": "Start.", "on":
           {"BEGIN_PHASE": {"target": "child-phase"}}},
         "child-phase": {"type": "phase", "description": "Delegate to child.",
           "on": {"PHASE_DONE": {"target": "parent-done"}}},
         "parent-done": {"type": "final", "description": "Done."}}}

    child.json:
      {"id": "child-task", "name": "Child Task", "version": "1.0.0",
       "spec_version": "3.0.0", "initial": "todo",
       "context": {"result": ""},
       "scenarios": [{"id": "default", "label": "Default",
         "initial": "todo"}],
       "states": {
         "todo": {"description": "Do work.", "on":
           {"CHILD_DONE": {"target": "child-done"}}},
         "child-done": {"type": "final", "description": "Done."}}}

    Create a runs/ dir in the workspace, then drive the parent and child:

    1. Init the PARENT (scenario default, no inputs) and enter its phase state:
         python skills/machina-driving/scripts/machine-driver.py init
           --machine <abs path of parent.json> --scenario default
           --run-dir <abs path of runs/>
         python skills/machina-driving/scripts/machine-driver.py fire
           BEGIN_PHASE --run <parent_run_id> --note "enter child phase"
           --run-dir <abs path of runs/>

    2. Init the CHILD as a nested run and drive it to its terminal state:
         python skills/machina-driving/scripts/machine-driver.py init
           --machine <abs path of child.json> --scenario default
           --run-dir <abs path of runs/>
         python skills/machina-driving/scripts/machine-driver.py fire
           CHILD_DONE --run <child_run_id> --note "child work done"
           --run-dir <abs path of runs/>

    3. Complete the parent phase, passing the child run:
         python skills/machina-driving/scripts/machine-driver.py fire
           PHASE_DONE --run <parent_run_id> --child-run <child_run_id>
           --note "phase complete" --run-dir <abs path of runs/>

    4. Run the integrity check and emit the parent's terminal report:
         python skills/machina-driving/scripts/machine-driver.py check
           --run <parent_run_id> --run-dir <abs path of runs/>
         python skills/machina-driving/scripts/machine-driver.py report
           --run <parent_run_id> --run-dir <abs path of runs/>

    The report is the strict-JSON machina.report.v1 object; when the parent
    reaches "parent-done" its result is SUCCESS and it lists the child run
    under nested_runs.

    Finish by giving the user a short grounded report (under ~80 words) that
    renders only the report facts: result, final_state, path, events, evidence,
    and the nested child run.
  files:
    - path: skills/machina-driving/scripts/machine-driver.py
    - path: skills/machina-authoring/scripts/machine-validator.py
graders:
  - name: names_nested_report
    type: text
    config:
      contains:
        - "nested"
        - "child"
  - name: parent_child_replay_verifiable
    type: program
    config:
      command: python
      args:
        - "evals/machina-simulator/graders/machina_replay.py"
        - "--expect-runs"
        - "2"
        - "--expect-result"
        - "SUCCESS"
        - "--expect-final-states"
        - "parent-done"
        - "--expect-terminal"
        - "complete"
        - "--expect-hash-ok"
        - "--expect-nested"
      timeout: 90