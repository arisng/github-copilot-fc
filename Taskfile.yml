# Task runner entry points for the Copilot FC workspace (taskfile.dev).
#
# The automated lint suite lives in scripts/workspace/ and is wired to git
# hooks via core.hooksPath=.githooks:
#   - task hooks:install        -> wire .githooks once per clone
#   - .githooks/pre-commit -> task lint  (fast: markdown baseline + schema/consistency)
#   - .githooks/pre-push   -> workspace-check.ps1 -SkipAdvisoryWaza
#                             (banner first; the ~21s advisory waza check is
#                             left to `task check` / CI, which run everything)
version: '3'

tasks:
  default:
    desc: Run the full lint suite (alias of check)
    cmds:
      - task: check

  lint:
    desc: Quick lint - changed markdown + schema/consistency engine (pre-commit gate)
    cmds:
      - pwsh -NoProfile -File scripts/workspace/workspace-check.ps1 -Quick

  check:
    desc: Full lint suite - all workspace checks (pre-push gate)
    cmds:
      - pwsh -NoProfile -File scripts/workspace/workspace-check.ps1

  check:linux:
    desc: Skill Pester suites in a Linux container (ubuntu-latest parity; requires Docker)
    cmds:
      - pwsh -NoProfile -File scripts/workspace/linux-pester.ps1

  test:
    desc: Run skill test suites (pytest over skills/)
    cmds:
      - python3 -m pytest skills -q

  issues:index:
    desc: Regenerate .issues/index.md from issue frontmatter
    cmds:
      - python3 skills/issue-md-writer/scripts/extract_issue_metadata.py

  skills:catalog:
    desc: Regenerate the skills catalog table in skills/README.md
    cmds:
      - python3 scripts/workspace/generate-skills-catalog.py

  hooks:install:
    desc: Wire .githooks as the git hooks directory for this clone (run once per clone/worktree)
    cmds:
      - git config core.hooksPath .githooks
